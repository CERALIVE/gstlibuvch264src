name: Publish Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - stable
          - beta
        default: stable

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calver.outputs.version }}
      channel: ${{ steps.calver.outputs.channel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate CalVer version
        id: calver
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'beta' }}
        run: |
          YEAR=$(date -u +"%Y")
          MONTH=$(date -u +"%-m")
          IS_BETA=$([[ "$RELEASE_TYPE" == "beta" ]] && echo "true" || echo "false")

          PREFIX="v${YEAR}.${MONTH}"

          if [ "$IS_BETA" == "true" ]; then
            LATEST_BETA=$(git tag -l "${PREFIX}.*-beta.*" | sed -E "s/.*-beta\.([0-9]+)/\1/" | sort -n | tail -1)
            if [ -z "$LATEST_BETA" ]; then
              BETA_NUM=1
            else
              BETA_NUM=$((LATEST_BETA + 1))
            fi
            LATEST_STABLE=$(git tag -l "${PREFIX}.*" | grep -v beta | sed "s/${PREFIX}\.//" | sort -n | tail -1)
            PATCH=${LATEST_STABLE:-0}
            NEXT_PATCH=$((PATCH + 1))
            VERSION="${YEAR}.${MONTH}.${NEXT_PATCH}-beta.${BETA_NUM}"
            CHANNEL="beta"
          else
            LATEST_PATCH=$(git tag -l "${PREFIX}.*" | grep -v beta | sed "s/${PREFIX}\.//" | sort -n | tail -1)
            if [ -z "$LATEST_PATCH" ]; then
              PATCH=0
            else
              PATCH=$((LATEST_PATCH + 1))
            fi
            VERSION="${YEAR}.${MONTH}.${PATCH}"
            CHANNEL="stable"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION} (Channel: ${CHANNEL})"

  build:
    name: Build (${{ matrix.config.arch }})
    needs: calculate-version
    runs-on: ${{ matrix.config.runner }}
    strategy:
      matrix:
        config:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test before packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libusb-1.0-0-dev libjpeg-dev
          cmake -B test-build -DENABLE_SANITIZERS=ON
          cmake --build test-build --parallel 2
          ctest --test-dir test-build --output-on-failure

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build with Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          outputs: build
          platforms: linux/${{ matrix.config.arch }}
          cache-from: type=gha,scope=${{ matrix.config.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.config.arch }}

      - name: Create packages
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
          ARCH: ${{ matrix.config.arch }}
        run: |
          mkdir -p dist
          bash scripts/build-deb.sh
          bash tests/package-contract.sh "dist/gstreamer1.0-libuvcsrc_${VERSION}_${ARCH}.deb"

          # Create .tar.gz archive
          mkdir -p "tarball/gstreamer1.0-libuvcsrc-${VERSION}"
          cp -r build/usr/* "tarball/gstreamer1.0-libuvcsrc-${VERSION}/"
          cd tarball
          tar -czvf "../dist/gstreamer1.0-libuvcsrc_${VERSION}_${ARCH}.tar.gz" "gstreamer1.0-libuvcsrc-${VERSION}"
          cd ..

          # Create checksums
          cd dist
          sha256sum "gstreamer1.0-libuvcsrc_${VERSION}_${ARCH}.deb" > "gstreamer1.0-libuvcsrc_${VERSION}_${ARCH}.deb.sha256"
          sha256sum "gstreamer1.0-libuvcsrc_${VERSION}_${ARCH}.tar.gz" > "gstreamer1.0-libuvcsrc_${VERSION}_${ARCH}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gstlibuvcsrc-${{ matrix.config.arch }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.sha256

  publish:
    permissions:
      contents: write
    name: Publish .deb to GitHub Release
    needs: [calculate-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare dist directory
        run: |
          mkdir -p dist/arm64 dist/amd64 dist/release
          mv artifacts/gstlibuvcsrc-arm64/*.deb dist/arm64/
          mv artifacts/gstlibuvcsrc-amd64/*.deb dist/amd64/
          cp artifacts/gstlibuvcsrc-arm64/*.tar.gz dist/release/
          cp artifacts/gstlibuvcsrc-amd64/*.tar.gz dist/release/
          cp artifacts/gstlibuvcsrc-arm64/*.sha256 dist/release/
          cp artifacts/gstlibuvcsrc-amd64/*.sha256 dist/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.calculate-version.outputs.version }}
          name: gstreamer1.0-libuvcsrc v${{ needs.calculate-version.outputs.version }}
          prerelease: ${{ needs.calculate-version.outputs.channel == 'beta' }}
          files: |
            dist/arm64/*.deb
            dist/amd64/*.deb
            dist/release/*.tar.gz
            dist/release/*.sha256
          body: |
            ## gstreamer1.0-libuvcsrc v${{ needs.calculate-version.outputs.version }}

            Portable userspace libuvc GStreamer source for devices advertising H.264 or H.265.

            ### Dependency Chain
            ```
            gstlibuvcsrc (this package) ← standalone GStreamer plugin
              ├── Depends: libgstreamer1.0-0
              │
              └── Used by: cerastream → ceralive-device
            ```

            ### Debian Packages
            | Architecture | Package |
            |--------------|---------|
            | ARM64 | `gstreamer1.0-libuvcsrc_${{ needs.calculate-version.outputs.version }}_arm64.deb` |
            | AMD64 | `gstreamer1.0-libuvcsrc_${{ needs.calculate-version.outputs.version }}_amd64.deb` |

            ### Binary Archives
            | Architecture | Archive |
            |--------------|---------|
            | ARM64 | `gstreamer1.0-libuvcsrc_${{ needs.calculate-version.outputs.version }}_arm64.tar.gz` |
            | AMD64 | `gstreamer1.0-libuvcsrc_${{ needs.calculate-version.outputs.version }}_amd64.tar.gz` |

            ### Installation

            **Debian 13 Trixie:**
            ```bash
            sudo apt install ./gstreamer1.0-libuvcsrc_${{ needs.calculate-version.outputs.version }}_<arch>.deb
            ```

            **Manual:**
            ```bash
            tar -xzf gstreamer1.0-libuvcsrc_${{ needs.calculate-version.outputs.version }}_<arch>.tar.gz
            sudo cp -r gstreamer1.0-libuvcsrc-${{ needs.calculate-version.outputs.version }}/* /usr/
            ```

  # G-A guardrail: only fire the reindex AFTER the .deb is attached to the
  # GitHub Release, so apt-worker never pulls a tag that has no asset yet.
  apt-reindex:
    name: Trigger APT reindex
    needs: [calculate-version, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger centralized APT reindex
        uses: peter-evans/repository-dispatch@v4
        with:
          # Fine-grained PAT with contents:write on CERALIVE/apt-worker.
          token: ${{ secrets.CERALIVE_DISPATCH_TOKEN }}
          repository: CERALIVE/apt-worker
          event-type: apt-reindex
          client-payload: >-
            {"component":"gstreamer1.0-libuvcsrc","repo":"gstlibuvcsrc","channel":"${{ needs.calculate-version.outputs.channel }}","tag":"v${{ needs.calculate-version.outputs.version }}","version":"${{ needs.calculate-version.outputs.version }}"}
